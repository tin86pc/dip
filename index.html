<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIP Switch</title>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs2@0.0.2/qrcode.min.js"></script>
    <style>
        * {margin:0; padding:0; box-sizing:border-box; font-family:sans-serif;}
        body {padding:2rem; max-width:550px; margin:0 auto; background:#f5f5f7;}

        .mode {text-align:center; margin-bottom:1.5rem;}
        .mode-btn {
            padding:0.7rem 1.2rem; border:2px solid #0071e3; background:#fff;
            color:#0071e3; border-radius:8px; cursor:pointer; font-weight:bold; font-size:1.1rem;
        }
        .mode-btn.active {background:#0071e3; color:#fff;}

        .input-box {margin-bottom:1.5rem;}
        input {
            width:100%; padding:1rem; font-size:1.8rem; border:2px solid #ddd;
            border-radius:8px; text-align:center; outline:none; font-weight:bold;
        }
        input:focus {border-color:#0071e3;}

        .dip-wrap {
            display:flex; justify-content:center; gap:8px;
            background:#333; padding:1.8rem 1rem; border-radius:12px; margin-bottom:1.8rem;
        }
        .dip {display:flex; flex-direction:column; align-items:center; cursor:pointer;}
        .dip-num {color:#fff; font-size:1rem; font-weight:bold; margin-bottom:6px;}
        .dip-bar {
            width:32px; height:60px; background:#555; border-radius:5px; position:relative;
        }
        .dip-bar.on .knob {top:0;}
        .dip-bar.off .knob {top:50%;}
        .knob {
            position:absolute; width:100%; height:50%; background:#4cd964; border-radius:4px;
            transition:top .2s ease;
        }

        .qr-section {text-align:center; padding:1.5rem; background:#fff; border-radius:10px;}
        .qr-title {font-size:1rem; color:#666; margin-bottom:1rem;}
        #qrcode {display:flex; justify-content:center;}
        #qrcode img {border:4px solid #f5f5f7; border-radius:8px;}
    </style>
</head>
<body>

    <div class="mode">
        <button class="mode-btn" id="modeBtn">➡️ Phải → Trái</button>
    </div>

    <div class="input-box">
        <input type="number" id="numInput" min="0" max="255" placeholder="Nhập số (0-255)">
    </div>

    <div class="dip-wrap" id="dipWrap"></div>

    <div class="qr-section">
        <div class="qr-title">📱 Quét mã QR để chia sẻ trang này</div>
        <div id="qrcode"></div>
    </div>

    <script>
        let isLTR = false; // Mặc định: Phải → Trái
        const dipWrap = document.getElementById('dipWrap');
        const modeBtn = document.getElementById('modeBtn');
        const numInput = document.getElementById('numInput');

        const switches = [];
        
        // Tạo 8 công tắc DIP
        for (let i = 1; i <= 8; i++) {
            const div = document.createElement('div');
            div.className = 'dip';
            div.innerHTML = `<div class="dip-num">${i}</div><div class="dip-bar off"><div class="knob"></div></div>`;
            dipWrap.appendChild(div);
            switches.push(div.querySelector('.dip-bar'));
        }

        // Lấy chuỗi bit từ các công tắc
        function getBits() {
            return switches.map(s => s.classList.contains('on') ? '1' : '0').join('');
        }

        // Cập nhật ô số từ trạng thái công tắc
        function refresh() {
            const bits = getBits();
            const show = isLTR ? bits : [...bits].reverse().join('');
            numInput.value = parseInt(show, 2) || 0;
        }

        // Cập nhật công tắc từ số nhập vào — ĐÃ SỬA LỖI
        function setFromNumber(n) {
            n = Math.max(0, Math.min(255, n || 0)); // Giới hạn 0-255
            let bits = n.toString(2).padStart(8, '0'); // Đảm bảo đủ 8 bit
            if (!isLTR) bits = [...bits].reverse().join(''); // Đảo ngược nếu cần
            
            // Cập nhật từng công tắc
            switches.forEach((s, i) => {
                const isOn = bits[i] === '1';
                s.classList.toggle('on', isOn);
                s.classList.toggle('off', !isOn);
            });
        }

        // Chuyển đổi thứ tự bit
        modeBtn.addEventListener('click', () => {
            isLTR = !isLTR;
            modeBtn.classList.toggle('active', isLTR);
            modeBtn.textContent = isLTR ? '⬅️ Trái → Phải' : '➡️ Phải → Trái';
            setFromNumber(parseInt(numInput.value) || 0); // Cập nhật lại ngay khi đổi chế độ
        });

        // Nhấn công tắc thủ công → cập nhật số
        switches.forEach(s => {
            s.addEventListener('click', () => {
                s.classList.toggle('on');
                s.classList.toggle('off');
                refresh();
            });
        });

        // ✅ SỬA Ở ĐÂY: Nhập số → tự cập nhật DIP ngay khi gõ
        numInput.addEventListener('input', () => {
            const v = parseInt(numInput.value);
            if (!isNaN(v)) setFromNumber(v);
        });

        // Khi nhấn Enter hoặc mất focus
        numInput.addEventListener('change', () => {
            let v = parseInt(numInput.value) || 0;
            v = Math.max(0, Math.min(255, v)); // Đảm bảo giới hạn
            numInput.value = v;
            setFromNumber(v);
        });

        // Tạo mã QR
        new QRCode(document.getElementById('qrcode'), {
            text: window.location.href,
            width: 180,
            height: 180,
            colorDark: '#0071e3',
            colorLight: '#ffffff',
            correctLevel: QRCode.CorrectLevel.M
        });

        // Khởi tạo
        refresh();
    </script>
</body>
</html>
